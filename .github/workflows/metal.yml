name: Metal validation
on:
  push:
    branches: [feature/apple-metal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Identify the Metal device
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string
          swift -e 'import Metal; print("Metal devices:", MTLCopyAllDevices().map { $0.name })'
      - name: Compile the MSL on the runner GPU
        run: |
          cat src/gpu/energy.h src/gpu/fold.h src/metal/fold.metal > "$RUNNER_TEMP/fold.metal"
          swift -e 'import Foundation; import Metal
          guard let gpu = MTLCreateSystemDefaultDevice() else { fatalError("No Metal GPU") }
          let source = try String(contentsOfFile: CommandLine.arguments[1], encoding: .utf8)
          let library = try gpu.makeLibrary(source: source, options: nil)
          _ = try gpu.makeComputePipelineState(function: library.makeFunction(name: "fold")!)' "$RUNNER_TEMP/fold.metal"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Build and install the Apple Silicon wheel
        run: |
          python -m pip install "maturin==1.16.0" "ViennaRNA==2.8.0" numpy
          maturin build --release --locked --out dist
          python -m pip install dist/*.whl
      - name: Compare Metal with ViennaRNA
        run: python scripts/check_cuda.py --backend metal
      - name: Benchmark independent oligo sets
        run: python scripts/benchmark_apple.py
