name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Package registry
        type: choice
        options: [testpypi, pypi, private-index]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    if: inputs.registry == 'pypi' || inputs.registry == 'testpypi'
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  publish-private:
    if: inputs.registry == 'private-index'
    needs: build
    runs-on: ubuntu-24.04
    environment: private-index
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install "twine>=6,<8"
      - name: Upload distributions
        env:
          TWINE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          : "${TWINE_REPOSITORY_URL:?Set PACKAGE_REPOSITORY_URL in the private-index environment}"
          : "${TWINE_USERNAME:?Set TWINE_USERNAME in the private-index environment}"
          : "${TWINE_PASSWORD:?Set TWINE_PASSWORD in the private-index environment}"
          python -m twine upload --non-interactive dist/*
