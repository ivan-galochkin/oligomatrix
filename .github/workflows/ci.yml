name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: cargo fmt --check
      - run: python3 scripts/build_cuda.py --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked

  wheel:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out dist
      - name: Check wheel metadata and compare installed wheel with ViennaRNA
        run: |
          python -m pip install dist/*.whl "ViennaRNA==2.8.0" "twine>=6,<8"
          python -m twine check --strict dist/*.whl
          python scripts/check_matrix.py
      - name: Verify CPU operation and explicit CUDA error without a visible GPU
        env:
          CUDA_VISIBLE_DEVICES: '-1'
        run: |
          python - <<'PY'
          from oligomatrix import energy_matrix
          assert energy_matrix(["A"], ["T"], backend="cpu").item() == 0
          try:
              energy_matrix(["A"], ["T"], backend="cuda")
          except RuntimeError as error:
              assert "CUDA" in str(error), error
          else:
              raise AssertionError("CUDA call unexpectedly succeeded without a visible device")
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - name: Test the same wheel on the minimum supported Python
        run: |
          python -m pip install dist/*.whl
          python -c "import numpy as np; from oligomatrix import energy_matrix; np.testing.assert_array_equal(energy_matrix(['GAT'], ['ATCG']), np.array([[-0.6]], dtype=np.float32))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Build and install the source distribution
        run: |
          python -m pip install "maturin==1.16.0" "twine>=6,<8" "ViennaRNA==2.8.0"
          maturin sdist --out dist
          python -m twine check --strict dist/*.tar.gz
          python -m pip install dist/*.tar.gz
      - run: python scripts/check_matrix.py --stress
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
